                        "requestId": {
                          "type": "string",
                          "description": "请求追踪 ID"
                        }
                      },
                      "required": [
                        "code",
                        "message"
                      ]
                    },
                    {
                      "type": "object",
                      "properties": {
                        "data": {
                          "type": "object",
                          "properties": {
                            "island": {
                              "type": "object",
                              "description": "岛信息（island/v1/detail 的 data.island 字段）",
                              "properties": {
                                "id": {
                                  "type": "string",
                                  "description": "Island ID（源类型 uint64，线格式为字符串）"
                                },
                                "name": {
                                  "type": "string",
                                  "description": "岛名称"
                                },
