{
  "openapi": "3.0.3",
  "info": {
    "title": "千岛小程序开放平台 API（qdmp OpenAPI）",
    "version": "1.0.0",
    "description": "千岛小程序开放平台(qdmp)对外 OpenAPI 定义，作为 Node.js/Java/Go 三端 SDK 类型生成与路由元数据生成的单一真源。逐条核对官方接口文档，并结合真实测试账号的实测结果订正（详见各字段 description 中的“实测确认”标注）。",
    "x-format-note": "本文件内容是合法 JSON（JSON 是 YAML 1.2 的严格子集），使用 .yaml 扩展名是为了贴合 OpenAPI 生态的书写习惯；shared/scripts/gen-route-meta.mjs 用 Node.js 内置 JSON.parse 直接读取本文件，零第三方依赖，也避免了手写 YAML 缩进解析器的脆弱性。任意标准 YAML 解析器或 OpenAPI 工具链也都能正确解析本文件。"
  },
  "servers": [
    {
      "url": "https://openapi.qiandao.com"
    }
  ],
