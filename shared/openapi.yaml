  "paths": {
    "/auth/v1/token": {
      "post": {
        "operationId": "authToken",
        "tags": [
          "auth"
        ],
        "summary": "获取访问令牌",
        "description": "支持两种授权模式：CLIENT_CREDENTIALS（客户端凭证）和 AUTHORIZATION_CODE（授权码，用户登录后）。",
        "x-qdmp-auth-scheme": "noAuth",
        "x-qdmp-token-required": false,
        "parameters": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "grantType": {
                    "type": "string",
                    "enum": [
                      "CLIENT_CREDENTIALS",
                      "AUTHORIZATION_CODE"
                    ],
                    "description": "授权类型：CLIENT_CREDENTIALS 或 AUTHORIZATION_CODE"
                  },
                  "appId": {
                    "type": "string",
                    "description": "应用 ID"
                  },
                  "appSecret": {
                    "type": "string",
                    "description": "应用密钥"
                  },
                  "code": {
                    "type": "string",
                    "description": "授权码，来自 qd.login()。仅 grantType=AUTHORIZATION_CODE 时必填；该约束在运行时校验，不在 schema 层强制声明为 required（源文档标注 required 但描述又说明“仅授权码模式必填”，语义矛盾，此处以放宽为可选处理）。"
                  }
                },
                "required": [
                  "grantType",
                  "appId",
                  "appSecret"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功获取 token。已知业务错误码（通过 code 字段表达）：10001 appId 无效、10002 密钥不匹配、10003 授权码错误、10004 认证类型不支持。",
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "type": "object",
                      "description": "业务信封基础结构 {code, message, requestId, data}（data 由各 operation 的响应单独描述）。实测确认：code 字段类型不统一，见过数字(0/10008/20000等)也见过字符串(\"0\")；且不保证 HTTP 200 即代表业务成功——例如 refreshToken 过期时是 HTTP 200 + code=10008，而 access-token 缺失/非法则是真实 HTTP 401 + code=10005。调用方必须显式检查 code 字段，不能只信任 HTTP 状态码。",
                      "properties": {
                        "code": {
                          "oneOf": [
                            {
                              "type": "integer"
                            },
                            {
                              "type": "string"
                            }
                          ],
                          "description": "业务状态码，0/\"0\" 通常表示成功，非零/非\"0\"表示业务错误。取值不是封闭枚举，已知码见顶层 x-error-codes。"
                        },
                        "message": {
                          "type": "string",
                          "description": "人类可读的提示信息"
                        },
                        "requestId": {
                          "type": "string",
                          "description": "请求追踪 ID"
                        }
                      },
                      "required": [
                        "code",
                        "message"
                      ]
                    },
                    {
                      "type": "object",
                      "properties": {
                        "data": {
                          "type": "object",
                          "properties": {
                            "accessToken": {
                              "type": "string",
                              "description": "访问令牌"
                            },
                            "expiresAt": {
                              "type": "string",
                              "description": "过期时间（秒）。实测确认响应为字符串，如 \"1785508950\"，不是数字（源文档标注 int64，容易误判为 number，此处按实测订正为 string）。"
                            },
                            "refreshToken": {
                              "type": "string",
                              "description": "刷新令牌"
                            },
                            "openId": {
                              "type": "string",
                              "description": "用户应用下唯一标识"
                            }
                          }
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "default": {
            "description": "网关层错误（第二种信封，无 data/requestId），已知示例：code=13 query parse error、code=2 openid is required",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "description": "第二种错误信封：网关层错误，不含 data / requestId 字段，与业务信封结构不同。code 是类 gRPC 状态码的小整数，实测见过 13(\"query parse error\")、2(\"openid is required\")。这两个具体码是网关层示例，不属于顶层 x-error-codes 清单（那份清单专指业务信封的已知错误码）。HTTP 状态码未逐条验证。",
                  "properties": {
                    "code": {
                      "type": "integer",
                      "description": "类 gRPC 状态码，实测见过 2、13"
                    },
                    "message": {
                      "type": "string"
                    },
                    "details": {
                      "description": "错误详情，具体结构未完全验证",
                      "nullable": true
                    }
                  },
                  "required": [
                    "code",
                    "message"
                  ]
                }
              }
            }
          }
        }
      }
    },
