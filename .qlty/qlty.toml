config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[runtimes.enabled]
# checkstyle 13.5.0 / google-java-format 1.32.0 both need a JDK new enough to
# run the tool itself (checkstyle needs class-file version 65 = JDK 21;
# google-java-format 1.32.0 touches a JDK-21-only javac AST node,
# JCTree$JCAnyPattern) — independent of the project's own source/target
# compatibility (11/17). Pinned to a real Adoptium release tag (see
# api.adoptium.net/v3/assets/latest/21/hotspot?os=mac&architecture=aarch64),
# not just "21", which 404s.
java = "21.0.12+8"

[[source]]
name = "default"
default = true

# 只使用 qlty 本地能力（qlty check / qlty fmt），不接入 Qlty Cloud dashboard/上传。
#
# 注意：eslint 插件故意没有启用。gts 的 eslint.config.cjs 用 typescript-eslint
# 的类型感知规则（parserOptions.project 相对路径指向 ./tsconfig.json），而 qlty
# 的 eslint driver 固定会把 config_file 拷贝进它自己的隔离工具安装目录再执行
# （plugin.toml 里 copy_configs_into_tool_install=true 且不可被项目级配置覆盖，
# 已验证 `copy_configs_into_tool_install` 不是受支持的项目级字段），导致相对路径
# 指向的 tsconfig.json 在拷贝后的目录里根本不存在（ENOENT）。Node 端真正权威的
# lint/typecheck 网关是 `npm run lint`（gts lint）+ `npm run typecheck`（tsc
# --noEmit），两者都在本地和 CI 里正常工作，qlty 这边就不重复接一个跑不通的
# eslint 了，避免维护一份形同虚设的假绿灯。

[[plugin]]
name = "prettier"
version = "3.6.2"

[[plugin]]
name = "gofmt"
version = "1.22.0"

[[plugin]]
name = "golangci-lint"
version = "2.12.2"

# 注意：checkstyle 插件同样故意没有启用（跟上面 eslint 的原因类似）。qlty 的
# checkstyle driver 要求项目里有一份静态 checkstyle.xml（config_files =
# ["checkstyle.xml"]），但本仓库的 java/build.gradle.kts 是故意从 checkstyle
# jar 里用 resources.text.fromArchiveEntry 动态抽取 google_checks.xml、不额外
# vendor 一份静态拷贝（避免规则集和 toolVersion 脱节）。qlty 找不到
# checkstyle.xml 时会把目标 Java 源文件本身错当成 XML 配置去解析，直接报
# "Content is not allowed in prolog"。Java 端真正权威的 lint 网关是
# `gradle checkstyleMain checkstyleTest spotlessCheck`（已接入 java-ci.yml），
# 这里不重复接一个会崩溃的 checkstyle。google-java-format 走 spotless 的
# formatOnly 校验、不需要外部配置文件，正常启用。
#[[plugin]]
#name = "checkstyle"
#version = "13.5.0"

[[plugin]]
name = "google-java-format"
version = "1.32.0"

[[plugin]]
name = "gitleaks"
version = "8.29.1"
